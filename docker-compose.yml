version: '3.8'

services:
  ocean-plotter:
    build: 
      context: .
      dockerfile: Dockerfile
    mem_limit: 8g
    mem_reservation: 6g
    deploy:
      resources:
        limits:
          memory: 8G
    ports:
      - "8086:8000"
    volumes:
      - ./app:/app/app
      - ./app/static:/app/static
      - /mnt/data/ocean_portal/datasets:/app/datasets
    environment:
      - RELOAD=${RELOAD:-false}
      - WEB_CONCURRENCY=${WORKERS:-3}  # gunicorn worker count (each worker is a full copy of the plotting stack)
      - UVICORN_TIMEOUT_KEEP_ALIVE=60  # Keep-alive timeout
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3